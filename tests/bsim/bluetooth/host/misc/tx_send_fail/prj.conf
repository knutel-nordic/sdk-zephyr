CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_ARCH_POSIX_TRAP_ON_FATAL=y

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TX send fail"
CONFIG_BT_GATT_CLIENT=y

# The bug only exists with a dedicated TX processor thread, and is
# detected through the HCI command timeout assert.
CONFIG_BT_TX_PROCESSOR_THREAD=y
CONFIG_BT_ASSERT=y

CONFIG_BT_MAX_CONN=1
